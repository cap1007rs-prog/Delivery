<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f7f7f6; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background-color: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; }
        .header-container { text-align: center; margin-bottom: 20px; }
        .header-container img { max-width: 200px; height: auto; }
        .header-container h1 { font-size: 2.5em; color: #333; margin: 10px 0; }
        h2 { text-align: center; color: #333; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #e04f5f; border: none; border-radius: 4px; color: white; font-size: 1.1em; cursor: pointer; transition: background-color 0.3s; }
        button:hover { background-color: #c0394b; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="header-container">
            <img src="img/spiderman1.jpg" alt="Spider-Man">
            <h1>Spider-Man Food Delivery</h1>
        </div>
        <h2>Login </h2>
        <form action="dashboard.html">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password">
            </div>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
